    <meta

      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!--
      The manifest is what makes this installable, and bubblewrap fetches it
      over the network when the APK is built -- so it has to be live on the
      domain before packaging, not just present in the repo.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <meta name="theme-color" content="#202b3b" />
    <title>HotHandZ</title>
  </head>
  <body style="margin: 0">
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
